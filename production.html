<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1v1 · 制作工作台</title></head><body><main><header><div><h1>制作工作台</h1><p>批量对战，筛选交锋，导出竖屏视频。</p></div><a href="/index.html">竞技场 ↗</a></header><section><h2>新批次</h2><p>下面的配置决定对手、样本数、筛选数量和视频样式。可先批量模拟，再筛选和导出。</p><textarea id="config" aria-label="批次配置"></textarea><div class="controls"><button id="batch">批量模拟</button><button id="produce">一键制作</button></div></section><section><h2>任务与续跑</h2><label>已有批次<select id="jobs"></select></label><div class="controls"><button id="refresh">刷新列表</button><button id="rank">筛选</button><button id="render">导出选中</button><button id="resume">恢复制作</button><button id="cancel">取消当前任务</button></div><p id="status" role="status">正在连接本地制作服务…</p><div id="summary"></div><div class="scroll"><table><thead><tr><th>比赛</th><th>评分 / 筛选理由</th><th>任务状态</th><th>视频进度</th><th>回放 / 视频</th></tr></thead><tbody id="tasks"></tbody></table></div><details><summary>排名与故障记录</summary><pre id="details"></pre></details></section><p><a href="/replay.html">打开独立回放播放器 ↗</a></p></main><script type="module" src="/src/web/production.ts"></script></body></html>
