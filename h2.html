<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>H2 · 观感盲评</title></head><body><main><header><div><span class="eyebrow">1V1 ARENA · H2 REVIEW</span><h1>两角色观感盲评</h1><p>观看 20 场隐藏人格的比赛。重点观察 A 方；双方能力相同，感知水平固定。</p></div></header><div class="settings"><label>观看场次<select id="clip"></select></label><button id="play">开始</button><button id="next" class="secondary">下一场</button><label>速度<select id="speed"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select></label><span id="clock"></span></div><section class="battle"><div class="stage"><canvas id="arena" width="960" height="960"></canvas><input id="seek" type="range" min="0" max="0" value="0" aria-label="观看进度" style="width:100%"></div><aside><h2 id="label">载入中</h2><form id="rating"><label id="pair-preference" hidden>本对节奏与可读性偏好<select name="preference"><option value="">未评</option><option value="X">X 更好</option><option value="Y">Y 更好</option><option value="tie">差不多</option></select></label><label>是否看得懂<select name="readability"><option value="">未评</option><option>清楚</option><option>一般</option><option>不清楚</option></select></label><label>是否主动追击<select name="pursuit"><option value="">未评</option><option>明显</option><option>偶尔</option><option>很少</option></select></label><label>是否无意义空转<select name="idle"><option value="">未评</option><option>少</option><option>一般</option><option>多</option></select></label><label>打法印象<textarea name="style" rows="3" placeholder="更主动、等待反击，或没有明显风格"></textarea></label><label>补充备注<textarea name="notes" rows="3"></textarea></label></form><button id="save" class="secondary">下载观感表</button><p class="note">评分保存在本机浏览器，可下载后记录 H2 判断。工程测试不会替你判定观感通过。</p></aside></section><p id="message" role="status"></p></main><script type="module" src="/src/web/h2.ts"></script></body></html>
