<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1v1 · 独立回放</title></head><body><main><header><div><h1>独立回放播放器</h1><p>载入比赛保存的内容和呈现轨道，查看每个瞬间。</p></div><a href="/production.html">制作工作台 ↗</a></header><section><div class="controls"><label>选择回放文件夹<input id="files" type="file" webkitdirectory multiple></label><label>视频样式<select id="template"><option value="arena-dark">深色竞技场</option><option value="arena-light">浅色竞技场</option></select></label><label>导出尺寸<select id="preset"><option value="vertical-1080">1080p 正式视频</option><option value="vertical-720">720p 预览</option></select></label><button id="play" disabled>播放</button><button id="export" disabled>导出视频</button></div><p id="status" role="status">请选择包含 manifest.json 的回放文件夹</p><canvas id="video" width="720" height="1280"></canvas><input id="seek" type="range" min="0" max="0" step="0.25" value="0" disabled aria-label="回放时间"><p id="time"></p><h2>交锋与评分</h2><p id="score"></p><div id="exchanges" class="controls"></div><details><summary>评分分项与近似反射证据</summary><pre id="analysis"></pre></details><details><summary>事件时间线</summary><div id="events"></div></details><details><summary>原始比赛配置与校验</summary><pre id="config"></pre></details></section></main><script type="module" src="/src/web/replay.ts"></script></body></html>
